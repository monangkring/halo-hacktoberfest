<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Spesial Untukmu</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            text-align: center;
            background-color: #f2f2f2;
            margin: 0;
            padding: 0;
        }
        .container {
            margin-top: 50px;
            padding: 20px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 80%;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        h1 {
            color: #ff6347;
        }
        .heart {
            font-size: 70px;
            color: #ff6347;
        }
        p {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }
        .message {
            font-size: 18px;
            margin-top: 30px;
            color: #333;
        }
        button {
            padding: 10px 20px;
            font-size: 18px;
            background-color: #ff6347;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #ff4500;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>hallo fan, tidak terasa ya sudah sampai sejauh ini</h1>
        <div class="heart">❤️</div>
        <p class="message">banyak hal yang sudah terjadi dan sudah kita lewati yang manis yang marah-marah banyaklah...</p>
        <p class="message"><strong>Aku sayang kamu masih sama seperti dulu, mau jadi pacarku?</strong></p>
        <button onclick="alert('Yay! Terima kasih sudah bilang iya! ❤️')">Klik Kalau Kamu Mau</button>
    </div>

</body>
</html>
